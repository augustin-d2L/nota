include: package:flutter_lints/flutter.yaml

analyzer:
  # Stricter typing: no implicit casts from dynamic,
  # no silent fallback to dynamic (important for JSON from Supabase).
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**

# Extra rules on top of flutter_lints. Full list: https://dart.dev/lints
linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - always_declare_return_types
